# ============================================
# BharatChat Backend — Application Properties
# ============================================

spring.application.name=BharatChat
server.port=8080

# ====== SUPABASE POSTGRESQL DATABASE ======
# Set your Supabase credentials below or through environment variables
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.YOUR_SUPABASE_PROJECT_REF.supabase.co:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:YOUR_SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ====== JPA / HIBERNATE ======
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ====== JWT ======
jwt.secret=BharatChatSuperSecretKeyForJWTTokenGeneration2026IndiaKaApnaMessenger998877
jwt.expiration=86400000

# ====== CORS ======
cors.allowed-origins=*

# ====== FILE UPLOAD ======
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ====== LOGGING ======
logging.level.com.bharatchat=INFO
logging.level.org.springframework.web.socket=INFO
